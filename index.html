<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>動画集</title>


  <style>

    /* =========================
       基本設定
       ========================= */

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      width: 100%;

      min-height: 100%;

    }


    body {

      min-height: 100vh;

      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.35),
          rgba(255, 240, 248, 0.2)
        ),
        url("background.png");

      background-size: cover;

      background-position: center;

      background-attachment: fixed;

      background-repeat: no-repeat;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

      color: #444;

    }



    /* =========================
       タイトル
       ========================= */

    h1 {

      margin: 0;

      padding: 25px 20px 20px;

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 28px;

      font-size:
        clamp(28px, 4vw, 46px);

      font-weight: 800;

      letter-spacing: 0.08em;

      color: #4b4b4b;

      text-shadow:
        0 2px 0 rgba(255, 255, 255, 0.9),
        0 4px 12px rgba(0, 0, 0, 0.08);

    }



    /* =========================
       タイトル左右の画像
       ========================= */

    h1 img {

      width:
        clamp(70px, 9vw, 110px);

      height:
        clamp(70px, 9vw, 110px);

      object-fit: contain;

      filter:
        drop-shadow(
          0 6px 10px rgba(0, 0, 0, 0.12)
        );

      animation:
        float 3s ease-in-out infinite;

    }


    h1 img:last-child {

      animation-delay: 1.5s;

    }



    /* =========================
       ふわふわアニメーション
       ========================= */

    @keyframes float {

      0%,
      100% {

        transform:
          translateY(0);

      }

      50% {

        transform:
          translateY(-6px);

      }

    }



    /* =========================
       動画メニュー
       ========================= */

    #menu {

      width:
        min(1100px, 92vw);

      margin:
        10px auto 60px;

      padding: 10px;

      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(220px, 1fr)
        );

      gap: 24px;

    }



    /* =========================
       動画ボタン
       ========================= */

    .video-button {

      position: relative;

      padding: 0;

      border: 0;

      border-radius: 22px;

      overflow: hidden;

      background:
        rgba(255, 255, 255, 0.72);

      cursor: pointer;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.12);

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;

      backdrop-filter:
        blur(8px);

      -webkit-backdrop-filter:
        blur(8px);

    }



    /* =========================
       マウスを乗せたとき
       ========================= */

    .video-button:hover {

      transform:
        translateY(-8px)
        scale(1.02);

      box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.18);

    }



    /* =========================
       クリックした瞬間
       ========================= */

    .video-button:active {

      transform:
        translateY(-2px)
        scale(0.98);

    }



    /* =========================
       サムネイル
       ========================= */

    .video-button img {

      display: block;

      width: 100%;

      height: auto;

      transition:
        transform 0.35s ease,
        filter 0.35s ease;

    }


    .video-button:hover img {

      transform:
        scale(1.04);

      filter:
        brightness(1.04);

    }


    /* ==================================================
       Coming Soon
       ==================================================
       button8.png ～ button12.png と
       video8.mp4 ～ video12.mp4 を置くだけで使用可能。
       ボタン画像は既存ボタンと同じ扱い。
       ================================================== */

    .coming-soon {
      /* 必要になったら個別の見た目をここで変更可能 */
    }



    /* ==================================================
       動画再生画面
       ================================================== */

    #videoArea {

      display: none;

      /*
        タイトルの下に残っている
        画面の高さだけを使用する。

        ここが今回の重要ポイント。
      */

      width: 100%;

      height:
        calc(100vh - 145px);

      min-height: 0;

      padding:
        10px 20px 20px;

      align-items: center;

      justify-content: center;

      overflow: hidden;

    }



    /* =========================
       動画
       ========================= */

    #videoPlayer {

      display: block;

      width: auto;

      height: auto;

      /*
        横幅の上限
      */

      max-width:
        calc(100vw - 40px);

      /*
        タイトル分を引いた高さにする。

        これによって
        下側が画面外に出なくなる。
      */

      max-height:
        calc(100vh - 185px);

      object-fit: contain;

      border-radius: 20px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.28);

      background: #000;

    }



    /* ==================================================
       画面が横長で高さが低い場合
       ================================================== */

    @media (max-height: 800px) {

      #videoArea {

        height:
          calc(100vh - 120px);

        padding:
          5px 20px 10px;

      }


      #videoPlayer {

        max-height:
          calc(100vh - 145px);

        border-radius: 16px;

      }

    }



    /* ==================================================
       さらに高さが低い場合
       ================================================== */

    @media (max-height: 650px) {

      h1 {

        padding:
          10px 15px;

      }


      h1 img {

        width: 55px;

        height: 55px;

      }


      #videoArea {

        height:
          calc(100vh - 85px);

      }


      #videoPlayer {

        max-height:
          calc(100vh - 100px);

        border-radius: 12px;

      }

    }



    /* =========================
       スマホ
       ========================= */

    @media (max-width: 600px) {

      h1 {

        gap: 12px;

        padding:
          20px 10px 15px;

      }


      h1 img {

        width: 60px;

        height: 60px;

      }



      #menu {

        width: 94vw;

        grid-template-columns:
          repeat(
            2,
            minmax(0, 1fr)
          );

        gap: 14px;

      }



      .video-button {

        border-radius: 16px;

      }



      /*
        スマホ動画画面
      */

      #videoArea {

        width: 100%;

        height:
          calc(100vh - 105px);

        padding:
          10px;

      }


      #videoPlayer {

        max-width:
          calc(100vw - 20px);

        max-height:
          calc(100vh - 125px);

        border-radius: 14px;

      }

    }

  </style>

</head>



<body>


  <!-- =========================
       タイトル
       ========================= -->

  <h1>

    <img
      src="title-image.png"
      alt=""
    >

    <span>
      動画集
    </span>

    <img
      src="title-image.png"
      alt=""
    >

  </h1>



  <!-- =========================
       動画メニュー
       ========================= -->

  <div id="menu">


    <button
      class="video-button"
      onclick="playVideo('video1.mp4')"
    >

      <img
        src="button1.png"
        alt="ヤダッ"
      >

    </button>



    <button
      class="video-button"
      onclick="playVideo('video2.mp4')"
    >

      <img
        src="button2.png"
        alt="ツツウラウラ"
      >

    </button>



    <button
      class="video-button"
      onclick="playVideo('video3.mp4')"
    >

      <img
        src="button3.png"
        alt="ウサギ"
      >

    </button>



    <button
      class="video-button"
      onclick="playVideo('video4.mp4')"
    >

      <img
        src="button4.png"
        alt="セイレーン"
      >

    </button>



    <button
      class="video-button"
      onclick="playVideo('video5.mp4')"
    >

      <img
        src="button5.png"
        alt="パジャマパーティーズ"
      >

    </button>



    <button
      class="video-button"
      onclick="playVideo('video6.mp4')"
    >

      <img
        src="button6.png"
        alt="ギョニソ"
      >

    </button>



    <button
      class="video-button"
      onclick="playVideo('video7.mp4')"
    >

      <img
        src="button7.png"
        alt="タコダンス"
      >

    </button>


    <!-- =========================
         Coming Soon
         画像と動画を追加するだけで使用可能
         ========================= -->

    <button
      class="video-button coming-soon"
      data-video="video8.mp4"
      onclick="playVideo('video8.mp4')"
    >
      <img
        src="button8.png"
        alt="Coming Soon"
      >
    </button>


    <button
      class="video-button coming-soon"
      data-video="video9.mp4"
      onclick="playVideo('video9.mp4')"
    >
      <img
        src="button9.png"
        alt="Coming Soon"
      >
    </button>


    <button
      class="video-button coming-soon"
      data-video="video10.mp4"
      onclick="playVideo('video10.mp4')"
    >
      <img
        src="button10.png"
        alt="Coming Soon"
      >
    </button>


    <button
      class="video-button coming-soon"
      data-video="video11.mp4"
      onclick="playVideo('video11.mp4')"
    >
      <img
        src="button11.png"
        alt="Coming Soon"
      >
    </button>


    <button
      class="video-button coming-soon"
      data-video="video12.mp4"
      onclick="playVideo('video12.mp4')"
    >
      <img
        src="button12.png"
        alt="Coming Soon"
      >
    </button>


  </div>



  <!-- =========================
       動画再生エリア
       ========================= -->

  <div id="videoArea">


    <video
      id="videoPlayer"
      controls
      playsinline
    >

      <source
        id="videoSource"
        src=""
        type="video/mp4"
      >

    </video>


  </div>



  <!-- =========================
       JavaScript
       ========================= -->

  <script>

    const menu =
      document.getElementById("menu");


    const videoArea =
      document.getElementById("videoArea");


    const videoPlayer =
      document.getElementById("videoPlayer");


    const videoSource =
      document.getElementById("videoSource");



    /* =========================
       動画を再生
       ========================= */

    function playVideo(videoFile) {

      /*
        メニューを隠す
      */

      menu.style.display = "none";


      /*
        動画エリアを表示
      */

      videoArea.style.display = "flex";


      /*
        動画ファイルを設定
      */

      videoSource.src = videoFile;


      /*
        動画を読み込む
      */

      videoPlayer.load();


      /*
        再生
      */

      videoPlayer.play();

    }



    /* =========================
       動画終了後にメニューへ戻る
       ========================= */

    videoPlayer.addEventListener(
      "ended",
      function() {

        videoPlayer.pause();

        videoPlayer.currentTime = 0;

        videoArea.style.display = "none";

        menu.style.display = "grid";

      }
    );

  </script>


</body>

</html>
